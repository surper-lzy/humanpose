tracking:
  one_euro:
    # Offline recordings are about 2 FPS. Retune for a future 30 FPS stream.
    min_cutoff_hz: 0.5
    beta: 2.0
    derivative_cutoff_hz: 1.0

  # Keep the 1.34 s sparse intervals in group 1, but reset at the 2.619 s
  # and 193.318 s capture outages observed in the current recordings.
  reset_gap_s: 2.0
  max_prediction_s: 1.1
  min_observation_confidence: 0.05

  frame_presence:
    # Bottom contact may still be a complete person when feet remain visible.
    # Top/side contact is handled more conservatively for avatar output.
    enabled: true
    border_margin_px: 2.0
    min_valid_keypoints_on_border: 20
    min_mean_keypoint_score_on_border: 0.55
    min_visible_face_keypoints_at_top: 2
    min_visible_foot_keypoints_at_bottom: 4
    # A top/side crop can still receive 26 hallucinated 2D joints. For avatar
    # output, hide it until the bbox is fully inside; complete bottom contact
    # remains allowed when the feet are visible.
    reject_side_or_top_border_contact: true
    # Once truncation is confirmed, do not resume from a still-clipped box.
    latch_until_fully_inside: true

  # Common to all multi-person depth recovery modes. This gate rejects metric
  # poses that have values but are inconsistent with one human body.
  pose3d_quality:
    enabled: true
    min_valid_joint_count: 8
    min_valid_torso_joint_count: 3
    max_torso_depth_span_m: 0.55
    depth_jump_base_m: 0.20
    max_depth_speed_m_s: 2.50
    max_depth_jump_m: 0.65
    reject_depth_jump_joint_count: 5
    reject_bone_violation_count: 2
    prior_length_ratio: 1.65
    # A frontal/back-facing spine should stay close to its current 2D metric
    # projection. Excess depth separation invalidates the upper-body branch,
    # which can then be rebuilt safely from the current 2D skeleton.
    max_spine_projection_ratio: 1.35
    spine_projection_slack_m: 0.10
    hip_offset_max_m: 0.30
    thigh_max_m: 0.75
    shin_max_m: 0.75
    spine_max_m: 0.85
    head_neck_max_m: 0.40
    shoulder_offset_max_m: 0.38
    upper_arm_max_m: 0.55
    forearm_max_m: 0.50

  bone_statistics:
    min_joint_confidence: 0.05

  bone_constraint:
    enabled: true
    calibration:
      # Current recordings are dynamic, so this is a temporary sequence prior,
      # not a definitive anatomical calibration or a height estimate.
      min_samples_per_bone: 12
      target_samples_per_bone: 20
      max_samples_per_bone: 30
      min_keypoint_confidence: 0.6
      min_depth_confidence: 0.7
      max_relative_mad: 0.10
      outlier_relative_tolerance: 0.12
      outlier_absolute_tolerance_m: 0.02
      min_length_m: 0.03
      max_length_m: 1.2
    solver:
      # By default, observations at or above this confidence are anchors.
      # The multi-person live profile may opt into bounded observed projection.
      anchor_confidence: 0.55
      iterations: 6
      max_joint_correction_m: 0.08
      max_predicted_correction_m: 0.12
      fixed_joint_indices: [19]
