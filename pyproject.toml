[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbd-avatar"
version = "0.1.0"
description = "RGB-D skeleton recovery and avatar-driving experiments"
requires-python = ">=3.10"
dependencies = [
  "websockets>=15,<18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
