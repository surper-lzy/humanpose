name: rgbd-avatar

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip=24.3.1
  - setuptools=69.5.1
  - wheel

  # PyTorch GPU runtime. A system-wide CUDA toolkit/nvcc is not required
  # for inference when a compatible prebuilt MMCV wheel is available.
  - pytorch=2.1.0
  - torchvision=0.16.0
  - pytorch-cuda=11.8

  # Keep NumPy below 2.0 for the pinned OpenMMLab/Open3D stack.
  - numpy=1.26.4
  - scipy=1.11.4

  - pip:
      # OpenMIM installs the version-matched OpenMMLab packages after
      # this Conda environment has been created. Run:
      # mim install -r requirements-openmmlab.txt
      - openmim==0.3.9

      # RGB-D I/O, visualization, geometry, and tests.
      - opencv-python==4.10.0.84
      - Pillow==10.4.0
      - open3d==0.18.0
      - smplx==0.1.28
      - PyYAML==6.0.2
      - tqdm==4.67.1
      - rich==13.9.4
      - pytest==8.3.5

      # Browser-based textured Mixamo viewer. nerfview imports splines and
      # jaxtyping but does not currently declare them as package dependencies.
      - viser==1.0.30
      - nerfview==0.1.3
      - splines==0.3.3
      - jaxtyping==0.3.7
